# オントロジー inorg-1.0（無機材料の国内特許 1,200 件から作成）
# 版の固定日: 2026-10-19。この版は固定。変更するときは version を上げて別ファイルにする。
# 内容のハッシュ（概念・別名・親の sha256 先頭 16 桁）: 5bc74d92b7f9147a
# 作り方: scripts/build_ontology_inorganic.py（datasets/inorganic1200/documents_sections.csv の
#   doc_id 奇数＝開発用だけで候補語を数え、人が階層と別名を決めた）。報告: datasets/inorganic1200/ontology_report.md
# MOF（金属有機構造体）／PCP の評価用データは見ずに作った。
# 上位型は 課題(P)・解決手段(M)・用途(U)。上位型だけを共有する概念どうしの類似度は 0。
# 概念 236（中間 35・末端 201）、別名 2043。
version: "inorg-1.0"

top_types:
  - {id: P, label: 課題}
  - {id: M, label: 解決手段}
  - {id: U, label: 用途}

# 述語。group が同じなら近い（0.7）、polarity が逆なら 0。
predicates:
  - {id: addresses, label: "手段が課題を解決する", group: reduce, polarity: -1}
  - {id: used_for, label: "手段が用途に使われる", group: apply, polarity: 0}
  - {id: arises_in, label: "課題が用途で問題になる", group: locate, polarity: 0}
  - {id: suppresses, label: "抑制する（互換）", group: reduce, polarity: -1}
  - {id: prevents, label: "防止する（互換）", group: reduce, polarity: -1}
  - {id: causes, label: "引き起こす（互換）", group: induce, polarity: 1}
  - {id: degrades, label: "劣化させる（互換）", group: induce, polarity: 1}
  - {id: applied_to, label: "適用先（互換）", group: locate, polarity: 0}
  - {id: occurs_in, label: "生じる場所（互換）", group: locate, polarity: 0}

