# オントロジー v0.1
# 上位型は「対象／課題／手段／作用／効果」の 5 つ。上位型だけを共有する概念どうしの類似度は 0 とする
# （課題→手段→効果という形の一致だけでは得点を与えないため）。
version: "0.1"

top_types:
  - {id: T, label: 対象}
  - {id: P, label: 課題}
  - {id: M, label: 手段}
  - {id: A, label: 作用}
  - {id: E, label: 効果}

# 述語。group が同じなら近い（0.7）、polarity が逆なら 0。
predicates:
  - {id: suppresses, label: 抑制する, group: reduce, polarity: -1}
  - {id: prevents, label: 防止する, group: reduce, polarity: -1}
  - {id: causes, label: 引き起こす, group: induce, polarity: 1}
  - {id: degrades, label: 劣化させる, group: induce, polarity: 1}
  - {id: performs, label: 作用を生む, group: realize, polarity: 0}
  - {id: leads_to, label: 効果をもたらす, group: result, polarity: 0}
  - {id: occurs_in, label: 生じる場所, group: locate, polarity: 0}
  - {id: applied_to, label: 適用先, group: locate, polarity: 0}

# 中間概念（上位型の直下）。parents は複数可。
concepts:
  # ---- 課題 ----
