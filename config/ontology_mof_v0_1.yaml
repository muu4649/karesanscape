# 金属有機構造体（MOF）／多孔性配位高分子（PCP）特許用オントロジー v0.1
# 上位型は 課題（P）／解決手段（M）／用途（U）の 3 つ。上位型だけを共有する概念どうしの類似度は 0。
# 中間概念（例: 安定性の課題、有機配位子の設計、ガス分離）で同じ種類をまとめ、兄弟どうしが 0.5 以上になるよう 3〜4 段にしている。
# 英数字を含む別名には、全角英数字とハイフン違い（− U+2212、－ U+FF0D、‐ U+2010）の表記を自動で足している（特許本文は全角が多いため）。
# 手で別名を足すときは、全角表記も同じ並びで足すこと（本文の正規化はしていないため）。
version: "mof-0.1"

top_types:
  - {id: P, label: 課題}
  - {id: M, label: 解決手段}
  - {id: U, label: 用途}

# 述語。group が同じなら 0.7、polarity が逆なら 0、それ以外は 0.2。
predicates:
  - {id: addresses, label: "解決する（手段→課題）", group: reduce, polarity: -1}
  - {id: suppresses, label: "抑制する（手段→課題。辞書抽出器の互換用）", group: reduce, polarity: -1}
  - {id: prevents, label: "防止する（手段→課題。辞書抽出器の互換用）", group: reduce, polarity: -1}
  - {id: causes, label: "引き起こす（手段→課題。副作用）", group: induce, polarity: 1}
  - {id: degrades, label: "劣化させる（課題→手段。辞書抽出器の互換用）", group: induce, polarity: 1}
  - {id: used_for, label: "用途に使われる（手段→用途）", group: apply, polarity: 0}
  - {id: applied_to, label: "適用される（手段→用途。辞書抽出器の互換用）", group: apply, polarity: 0}
  - {id: arises_in, label: "用途で問題になる（課題→用途）", group: locate, polarity: 0}
  - {id: occurs_in, label: "生じる場所（課題→用途。辞書抽出器の互換用）", group: locate, polarity: 0}
  - {id: composed_of, label: "構成要素として含む（手段→手段。材料が金属種・配位子・構造を持つ）", group: compose, polarity: 0}
  - {id: made_by, label: "製造される（手段→手段。材料・成形体が合成法・後処理で作られる）", group: make, polarity: 0}

