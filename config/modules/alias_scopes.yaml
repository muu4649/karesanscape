# 上層の別名のうち、使う分野（部品）を限るもの。部品の照合で、ここに無い分野の文書ではこの別名を使わない。
# 2026-10-20、半導体の開発用 300 件で上層の表記の当たり方を読み、意味が違うものを選んだ（scripts/build_module.py の判定記録）。
alias_scopes:
- concept: P_capacity
  label: 放電容量
  alias: 容量
  modules:
  - inorganic
  - battery
  reason: 半導体の開発用の文書では 静電容量（容量結合型のプラズマ） の意味で当たる
- concept: P_conductivity
  label: イオン伝導度
  alias: 導電性
  modules:
  - inorganic
  - battery
  reason: 半導体の開発用の文書では 電子伝導（配線・電極） の意味で当たる
- concept: P_structural_stability
  label: 構造安定性
  alias: 変形
  modules:
  - inorganic
  - battery
  reason: 半導体の開発用の文書では 「変形例」 の意味で当たる
- concept: P_strength
  label: 機械的強度
  alias: 強度
  modules:
  - inorganic
  - battery
  reason: 半導体の開発用の文書では 磁界・光の強度 の意味で当たる
- concept: P_structure_target
  label: 高比表面積
