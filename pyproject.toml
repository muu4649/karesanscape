[project]
name = "ontomap"
version = "0.1.0"
description = "オントロジー関係性に基づく文書俯瞰マッピングと、文章ベクトル方式との比較実験"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "umap-learn>=0.5.6",
    "python-docx>=1.1",
    "psutil>=5.9",
]

[project.optional-dependencies]
embedding = [
    "sentence-transformers>=3.4",
    "transformers>=4.48",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
]
doc2vec = ["gensim>=4.3.3", "janome>=0.5"]
llm = ["anthropic>=0.70", "python-dotenv>=1.0"]
app = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9", "openpyxl>=3.1"]

[project.scripts]
ontomap = "ontomap.cli:main"
ontomap-app = "ontomap.app.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ontomap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
